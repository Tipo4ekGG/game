<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="description" content="Рикошет — минималистичная игра на реакцию. Уворачивайся от фигур и продержись как можно дольше.">
<title>Рикошет — не касайся</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<script defer src="./vendor/matter.min.js"></script>
<script defer src="./geometry.js"></script>
<script defer src="./game.js"></script>
</head>
<body>
<main class="game">
<header class="topbar">
<a class="wordmark" href="./" aria-label="Рикошет, главная"><span class="brand-icon" aria-hidden="true">◈</span> РИКОШЕТ<span class="edition"> / 01</span></a>
<div class="scores"><div><span class="label">ВРЕМЯ</span><span id="time" class="value">00:00.0</span></div><div><span class="label">РЕКОРД</span><span id="best" class="value secondary">00:00.0</span></div></div>
<button id="pause" class="icon-button" aria-label="Пауза" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg></button>
</header>
<section id="arena" class="arena" aria-label="Игровое поле">
<canvas id="canvas" tabindex="0" aria-label="Уворачивайтесь от фигур курсором, пальцем или стрелками клавиатуры. Escape — пауза."></canvas>
<div class="arena-meta" aria-hidden="true"><span id="mode">ПОЛЕ СВОБОДНО</span><span id="count">08 ФИГУР</span></div>
<div id="overlay" class="overlay">
<div class="panel">
<p id="eyebrow" class="eyebrow">ИГРА НА РЕАКЦИЮ</p>
<h1 id="title">Не касайся.</h1>
<p id="description" class="description">Ты — точка. Всё остальное — препятствия.<br>Двигайся и оставайся в игре.</p>
<div id="result" class="result" hidden></div>
<button id="action" class="action">Начать игру</button>
<p id="hint" class="hint">Курсор · касание · клавиши со стрелками</p>
</div>
</div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
</section>
<footer class="bottom-bar"><p><span class="player-symbol" aria-hidden="true"></span> ТЫ — БЕЛАЯ ТОЧКА</p><p id="footer-hint">УВОРАЧИВАЙСЯ. ДЕРЖИСЬ ДОЛЬШЕ.</p><span class="keyboard-hint"><kbd>ESC</kbd> ПАУЗА</span></footer>
</main>
<noscript>Для игры включите JavaScript в настройках браузера.</noscript>
</body>
</html>
